name: Bug report
description: Something in the installer, an agent, a skill, a command, or the docs is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: please follow SECURITY.md instead of opening a public issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - scripts/install.sh
        - An agent definition
        - A skill
        - A command (/run-delivery, /run-advisory, /run-status, /new-agent)
        - Process docs or a playbook
        - Plugin / marketplace
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit (e.g. v0.3.0, or `git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Install target, scope, and harness
      placeholder: "--target cursor --scope global; Cursor 1.x on macOS"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact commands, or the agent invocation and the files it read.
      render: shell
